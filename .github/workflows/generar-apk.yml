name: Generar APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Preparar carpeta web
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Compilar APK con Capacitor e Icono Personalizado
        run: |
          npm init -y
          npm install @capacitor/core@^6.0.0 @capacitor/cli@^6.0.0 @capacitor/android@^6.0.0
          npx cap init "Afinador" "com.afinador.app" --web-dir www
          npx cap add android

          # Inyección de permisos en AndroidManifest.xml
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i '/<application/i \    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />' "$MANIFEST"

          # Procesar icono con la herramienta oficial de Capacitor si existe icon.png
          if [ -f "icon.png" ]; then
            npm install -g @capacitor/assets
            npx capacitor-assets generate --android
          fi

          npx cap sync android
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Entregar APK
        uses: actions/upload-artifact@v4
        with:
          name: AfinadorPro-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
