name: Generar APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Preparar carpeta web
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Compilar APK con Capacitor e Icono
        run: |
          npm init -y
          npm install @capacitor/core@5.7.5 @capacitor/cli@5.7.5 @capacitor/android@5.7.5

          npx cap init "Afinador" "com.afinador.app" --web-dir www
          npx cap add android

          # Inyección limpia y segura de permisos usando Python
          python3 -c "
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          with open(manifest_path, 'r') as f:
              content = f.read()
          permissions = '''
              <uses-permission android:name=\"android.permission.RECORD_AUDIO\" />
              <uses-permission android:name=\"android.permission.MODIFY_AUDIO_SETTINGS\" />
          '''
          if 'RECORD_AUDIO' not in content:
              content = content.replace('<application', permissions + '\n    <application')
              with open(manifest_path, 'w') as f:
                  f.write(content)
          "

          # Generar iconos oficialmente con Capacitor Assets si existe icon.png
          if [ -f "icon.png" ]; then
            npm install @capacitor/assets@^3.0.0
            npx capacitor-assets generate --android
          fi

          npx cap sync android
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Entregar APK
        uses: actions/upload-artifact@v4
        with:
          name: AfinadorPro-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
